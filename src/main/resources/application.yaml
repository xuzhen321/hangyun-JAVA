# 公共配置: 所有非敏感内容都放这里
# 敏感信息(数据源连接)只在 application-dev.yaml / application-prod.yaml 中
spring:
  application:
    name: hangyun
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 打印 SQL
  global-config:
    db-config:
      id-type: auto          # 全局默认自增; 非自增表在实体上用 @TableId(type = ASSIGN_ID) 单独覆盖
  mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 固定 8080, 不做环境变量覆盖
server:
  port: 8080

logging:
  level:
    com.test.hangyun: debug

# =====================================================================
#  登录令牌(JWT)
# =====================================================================
#  ⚠️ 下面这个 secret 是**演示用的默认值**, 生产环境必须通过环境变量覆盖:
#         set HANGYUN_JWT_SECRET=<你自己的随机串>       (Windows)
#         export HANGYUN_JWT_SECRET=<你自己的随机串>     (Linux/Mac)
#  ⚠️ 长度必须 >= 32 字节 —— HMAC-SHA256 要求密钥不短于摘要长度,
#     短了 jjwt 会在**签发时**直接抛 WeakKeyException(启动不报错, 一登录就炸)。
hangyun:
  jwt:
    secret: ${HANGYUN_JWT_SECRET:hangyun-demo-jwt-secret-please-change-in-production-2026}
    # 令牌有效期(分钟)。过期后接口返回 401 + code=0, 前端跳登录页
    expire-minutes: 120
